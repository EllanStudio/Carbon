name: Build Velocity

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-velocity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build Velocity jar
        run: ./gradlew :carbonchat-velocity:productionJar --stacktrace
      - name: Upload Velocity jar
        uses: actions/upload-artifact@v7
        with:
          name: carbonchat-velocity
          path: velocity/build/libs/carbonchat-velocity-*.jar
